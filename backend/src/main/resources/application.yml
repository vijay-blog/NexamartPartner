spring:
  application:
    name: nexamart-partner-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/nexamart?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
server:
  port: ${PORT:8080}
  servlet:
    context-path: /
nexamart:
  jwt-secret: ${JWT_SECRET:change-this-development-secret-to-at-least-32-characters}
  access-token-minutes: ${ACCESS_TOKEN_MINUTES:60}
  refresh-token-days: ${REFRESH_TOKEN_DAYS:30}
  admin-username: ${ADMIN_USERNAME:admin}
  admin-password: ${ADMIN_PASSWORD:admin@223}
  admin-email: ${ADMIN_EMAIL:admin@nexamart.local}
  admin-name: ${ADMIN_NAME:NexaMart Admin}
management:
  endpoints:
    web:
      exposure:
        include: health,info
